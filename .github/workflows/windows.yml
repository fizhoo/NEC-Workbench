name: Windows Build

on:
  push:
    branches: [main, 'release/**', feature/baseline-reference, feature/compact-workspace, feature/compact-control-panel]
  pull_request:
  workflow_dispatch:
  # The release workflow builds and checks the package from its tag.
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      # The MINGW64 gcc (x86_64-w64-mingw32), linked statically; build.sh refuses MSYS gcc.
      - name: Build bundled nec2c
        shell: msys2 {0}
        run: |
          step=packaging/nec2c/ci-step.sh
          $step "nec2c build" packaging/nec2c/build.sh nec2c-bin nec2c-src
          $step "nec2c imports" packaging/nec2c/check-imports.sh nec2c-bin/nec2c.exe
          $step "nec2c source" packaging/nec2c/source-archive.sh dist nec2c-src
          # The runtime pieces linked into nec2c.exe bring their own notices.
          cp THIRD_PARTY_LICENSES.txt nec2c-bin/THIRD_PARTY_LICENSES.txt
          $step "runtime notices" packaging/nec2c/runtime-notices.sh nec2c-bin/THIRD_PARTY_LICENSES.txt

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      # The exact Qt source, for the attributions and license texts of the deployed Qt.
      - name: Qt version
        shell: pwsh
        run: echo "QT_VERSION=$(& (Join-Path $env:QT_ROOT_DIR 'bin/qmake.exe') -query QT_VERSION)" >> $env:GITHUB_ENV
      - name: Cache Qt source
        uses: actions/cache@v4
        with:
          path: qt-src
          key: qt-src-${{ env.QT_VERSION }}-qtbase-qtsvg
      - name: Download Qt source
        shell: bash
        run: packaging/qt-sources.sh "$QT_VERSION" qt-src qtbase qtsvg

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -T v143
          -DNECWB_BUILD_TESTS=ON
          && echo "PACKAGE=NEC-Workbench-$(Get-Content build/necwb-version.txt)-windows-x64.zip" >> $env:GITHUB_ENV

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        env:
          NECWB_SMOKE_TRACE: '1'
        run: |
          $out = ctest --test-dir build -C Release --output-on-failure --timeout 300 2>&1
          $out
          if ($LASTEXITCODE -ne 0) {
            Write-Output ("::error title=Windows tests::" + (($out | Select-Object -Last 60) -join "%0A"))
            exit 1
          }

      # Assembled by hand: Workbench and its Qt runtime, which must stay beside it, nec2c in
      # solvers/, and the installed examples in examples/. Workbench draws with QPainter, so
      # neither the software OpenGL (opengl32sw.dll, Mesa) nor the Direct3D shader compiler
      # is deployed. The license notices get a Qt section generated from the deployed files.
      - name: Package application
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          New-Item -ItemType Directory -Force package/solvers, package/examples | Out-Null
          Copy-Item build/Release/nec-workbench.exe package/
          Copy-Item LICENSE package/LICENSE.txt
          Copy-Item README.md package/
          Copy-Item nec2c-bin/THIRD_PARTY_LICENSES.txt package/
          Copy-Item nec2c-bin/nec2c.exe, nec2c-bin/nec2c-build.txt package/solvers/
          Copy-Item stage/share/nec-workbench/examples/*.nec package/examples/
          windeployqt --release --compiler-runtime --no-opengl-sw --no-system-d3d-compiler package/nec-workbench.exe
          $notices = python -I packaging/qt-notices.py --platform windows --deployed package `
            --qt-version $env:QT_VERSION `
            --qt-source "qt-src/qtbase-everywhere-src-$env:QT_VERSION.tar.xz" `
            --qt-source "qt-src/qtsvg-everywhere-src-$env:QT_VERSION.tar.xz" `
            --append package/THIRD_PARTY_LICENSES.txt 2>&1
          $notices
          if ($LASTEXITCODE -ne 0) {
            Write-Output ("::error title=Windows license notices::" + ($notices -join "%0A"))
            throw "license notices failed"
          }
          Write-Output ("::notice title=Windows license notices::" + ($notices -join "%0A"))
          Compress-Archive -Path package/* -DestinationPath $env:PACKAGE

      # The ZIP as a user gets it: unpacked into a fresh folder whose path has a space, fresh
      # settings, no nec2c on the PATH. Workbench must start its main window with the windows
      # platform plugin, and its license notices must name the Qt it runs on; and it must find
      # nec2c.exe in solvers/, read its version, solve, find the examples (exactly the
      # repository's) and solve one, and stop a run with Stop and with a timeout.
      - name: Check package
        shell: pwsh
        run: |
          if (Get-Command nec2c -ErrorAction SilentlyContinue) { throw "nec2c is on the PATH" }
          $check = Join-Path $env:RUNNER_TEMP "package check"
          Expand-Archive $env:PACKAGE -DestinationPath $check
          if (Test-Path (Join-Path $check "nec2c.exe")) { throw "nec2c.exe is at the top level, not in solvers/" }
          foreach ($file in "solvers/nec2c.exe", "solvers/nec2c-build.txt", "README.md", "LICENSE.txt", "THIRD_PARTY_LICENSES.txt") {
            if (-not (Test-Path (Join-Path $check $file))) { throw "$file is missing" }
          }
          $tracked = (git -c core.quotePath=off ls-files "examples/*.nec" | ForEach-Object { Split-Path -Leaf $_ } | Sort-Object) -join "|"
          $shipped = (Get-ChildItem (Join-Path $check "examples") -File | ForEach-Object Name | Sort-Object) -join "|"
          if ($tracked -ne $shipped) { throw "examples/ holds $shipped, not $tracked" }
          # The executable's version resource, from the CMake version.
          $info = (Get-Item (Join-Path $check "nec-workbench.exe")).VersionInfo
          $version = (Get-Content build/necwb-version.txt).Trim()
          if ($info.ProductVersion -ne $version -or $info.FileVersion -ne $version -or $info.ProductName -ne "NEC Workbench" -or -not $info.LegalCopyright -or -not $info.FileDescription) {
            throw "nec-workbench.exe version resource: $($info | Format-List | Out-String)"
          }
          $listing = @(
            "$env:PACKAGE"
            "nec-workbench.exe: $($info.ProductName) $($info.ProductVersion) ($($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)) · $($info.FileDescription) · $($info.LegalCopyright)"
            "top level: " + ((Get-ChildItem $check | ForEach-Object { $_.Name + $(if ($_.PSIsContainer) { "/" } else { "" }) }) -join ", ")
            "solvers/: " + ((Get-ChildItem (Join-Path $check "solvers") | ForEach-Object Name) -join ", ")
            "examples/: " + ((Get-ChildItem (Join-Path $check "examples") | ForEach-Object Name) -join ", ")
          ) -join "%0A"
          Write-Output ("::notice title=Windows ZIP contents::" + $listing)
          # The normal start, until the main window is on screen. A missing platform plugin
          # aborts with a dialog on Windows, so a start that does not end in time fails too.
          $startup = Join-Path $env:RUNNER_TEMP "startup-check.txt"
          $app = Start-Process -FilePath (Join-Path $check "nec-workbench.exe") `
            -ArgumentList "--startup-check" -WorkingDirectory $check -PassThru `
            -NoNewWindow -RedirectStandardOutput $startup
          $null = $app.Handle
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw "startup check did not end within 2 minutes" }
          $text = Get-Content -Raw $startup
          Write-Output $text
          if ($app.ExitCode -ne 0 -or $text -notmatch "(?m)^PASS main window shown: platform plugin windows, Qt ([0-9.]+),") {
            Write-Output ("::error title=Windows startup check::exit $($app.ExitCode)%0A" + ($text -replace "`r?`n", "%0A"))
            throw "startup check failed"
          }
          $qt = $Matches[1]
          $core = (Get-Item (Join-Path $check "Qt6Core.dll")).VersionInfo
          $deployed = "$($core.FileMajorPart).$($core.FileMinorPart).$($core.FileBuildPart)"
          if ($qt -ne $deployed) { throw "Workbench runs on Qt $qt, but the package's Qt6Core.dll is $deployed" }
          if (-not (Select-String -Path (Join-Path $check "THIRD_PARTY_LICENSES.txt") -Pattern "^Qt $([regex]::Escape($qt))$" -CaseSensitive -Quiet)) {
            Write-Output "::error title=Windows license notices::THIRD_PARTY_LICENSES.txt does not name Qt $qt, the Qt the package runs on"
            throw "license notices do not name Qt $qt"
          }
          Write-Output ("::notice title=Windows startup check::" + ($text -replace "`r?`n", "%0A") + "THIRD_PARTY_LICENSES.txt names Qt $qt; Qt6Core.dll is $deployed")
          $report = Join-Path $env:RUNNER_TEMP "package-check.txt"
          $run = Start-Process -FilePath (Join-Path $check "nec-workbench.exe") `
            -ArgumentList "--package-check" -WorkingDirectory $check -Wait -PassThru `
            -NoNewWindow -RedirectStandardOutput $report
          $text = Get-Content -Raw $report
          Write-Output $text
          if ($run.ExitCode -eq 0) { Write-Output ("::notice title=Windows package check::" + ($text -replace "`r?`n", "%0A")) }
          if ($run.ExitCode -ne 0) {
            Write-Output ("::error title=Windows package check::" + ($text -replace "`r?`n", "%0A"))
            throw "package check failed ($($run.ExitCode))"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: NEC-Workbench-Windows-x64
          path: |
            ${{ env.PACKAGE }}
            dist/nec2c-*-source.tar.gz
          if-no-files-found: error
          retention-days: 14
