name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -T v143
          -DNECWB_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/nec-workbench.exe package/
          windeployqt --release --compiler-runtime package/nec-workbench.exe
          Compress-Archive -Path package/* -DestinationPath NEC-Workbench-Windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: NEC-Workbench-Windows-x64
          path: NEC-Workbench-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
