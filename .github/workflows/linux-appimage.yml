name: Linux AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNECWB_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage application
        run: cmake --install build --prefix AppDir/usr

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          wget --quiet https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget --quiet https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/nec-workbench.desktop \
            --icon-file packaging/nec-workbench.svg \
            --plugin qt \
            --output appimage
          appimage=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*.AppImage' -print -quit)
          test -n "$appimage"
          mv "$appimage" NEC-Workbench-Linux-x86_64.AppImage

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: NEC-Workbench-Linux-x86_64
          path: NEC-Workbench-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
